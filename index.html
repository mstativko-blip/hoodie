<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Hoodie 3D Configurator</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }
    body {
      overflow: hidden;
      background-color: #121212;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      color: #ffffff;
    }
    #canvas-container {
      width: 100vw;
      height: 100vh;
    }
    
    .controls-wrapper {
      position: absolute;
      bottom: 24px;
      left: 50%;
      transform: translateX(-50%);
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 12px;
      z-index: 10;
    }

    /* Палитра реалистичных сложный оттенков */
    .color-picker {
      display: flex;
      gap: 10px;
      background: rgba(24, 24, 27, 0.85);
      backdrop-filter: blur(12px);
      padding: 10px 16px;
      border-radius: 30px;
      border: 1px solid rgba(255, 255, 255, 0.1);
    }
    .color-btn {
      width: 26px;
      height: 26px;
      border-radius: 50%;
      border: 2px solid rgba(255, 255, 255, 0.2);
      cursor: pointer;
      transition: transform 0.2s ease, border-color 0.2s ease;
    }
    .color-btn:hover {
      transform: scale(1.15);
      border-color: #ffffff;
    }

    .controls {
      display: flex;
      gap: 10px;
      background: rgba(24, 24, 27, 0.85);
      backdrop-filter: blur(12px);
      padding: 12px 20px;
      border-radius: 14px;
      border: 1px solid rgba(255, 255, 255, 0.1);
      box-shadow: 0 20px 25px -5px rgba(0, 0, 0, 0.5);
    }
    .btn {
      background: #ffffff;
      color: #000000;
      padding: 10px 16px;
      border-radius: 8px;
      cursor: pointer;
      font-weight: 600;
      font-size: 13px;
      border: none;
      transition: all 0.2s ease;
      display: inline-flex;
      align-items: center;
      justify-content: center;
    }
    .btn:hover {
      background: #e4e4e7;
      transform: translateY(-1px);
    }
    .btn-secondary {
      background: rgba(255, 255, 255, 0.1);
      color: #ffffff;
      border: 1px solid rgba(255, 255, 255, 0.15);
    }
    .btn-secondary:hover {
      background: rgba(255, 255, 255, 0.2);
    }
    .btn-action {
      background: #2563eb;
      color: #ffffff;
    }
    .btn-action:hover {
      background: #1d4ed8;
    }
    input[type="file"] {
      display: none;
    }
    #loading {
      position: absolute;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      font-size: 16px;
      letter-spacing: 0.05em;
      color: rgba(255, 255, 255, 0.6);
      pointer-events: none;
      transition: opacity 0.4s ease;
    }
  </style>

  <!-- Three.js + Loaders -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/OrbitControls.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/loaders/GLTFLoader.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/loaders/DRACOLoader.js"></script>
</head>
<body>

<div id="loading">Загрузка 3D модели...</div>
<div id="canvas-container"></div>

<div class="controls-wrapper">
  <!-- Палитра со сложными сложными тонами -->
  <div class="color-picker">
    <div class="color-btn" style="background: #F3F3F0;" title="Молочный" onclick="changeHoodieColor(0xF3F3F0)"></div>
    <div class="color-btn" style="background: #1A1A1D;" title="Графит" onclick="changeHoodieColor(0x1A1A1D)"></div>
    <div class="color-btn" style="background: #5A5D64;" title="Меланж" onclick="changeHoodieColor(0x5A5D64)"></div>
    <div class="color-btn" style="background: #8B2626;" title="Приглушенный красный" onclick="changeHoodieColor(0x8B2626)"></div>
    <div class="color-btn" style="background: #2D4A3E;" title="Оливково-зеленый" onclick="changeHoodieColor(0x2D4A3E)"></div>
    <div class="color-btn" style="background: #4A254B;" title="Темно-сливовый" onclick="changeHoodieColor(0x4A254B)"></div>
  </div>

  <div class="controls">
    <label for="upload-front" class="btn">Принт спереди</label>
    <input type="file" id="upload-front" accept="image/*">
    <button class="btn btn-secondary" onclick="clearPrint('front')">Сбросить</button>

    <label for="upload-back" class="btn">Принт сзади</label>
    <input type="file" id="upload-back" accept="image/*">
    <button class="btn btn-secondary" onclick="clearPrint('back')">Сбросить</button>

    <button class="btn btn-action" onclick="takeScreenshot()">Сделать скриншот</button>
  </div>
</div>

<script>
  let scene, camera, renderer, controls;
  const printMeshes = {};
  let mainHoodieMesh = null;
  const textureLoader = new THREE.TextureLoader();

  function init() {
    const container = document.getElementById('canvas-container');

    scene = new THREE.Scene();
    scene.background = new THREE.Color(0x121212);

    camera = new THREE.PerspectiveCamera(45, window.innerWidth / window.innerHeight, 0.1, 100);
    camera.position.set(0, 0, 1.8);

    renderer = new THREE.WebGLRenderer({ antialias: true, preserveDrawingBuffer: true });
    renderer.setSize(window.innerWidth, window.innerHeight);
    renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
    renderer.toneMapping = THREE.ACESFilmicToneMapping;
    renderer.toneMappingExposure = 1.0;
    container.appendChild(renderer.domElement);

    // Освещение для глубокой проработки складок
    const ambientLight = new THREE.AmbientLight(0xffffff, 0.9);
    scene.add(ambientLight);

    const mainLight = new THREE.DirectionalLight(0xffffff, 1.3);
    mainLight.position.set(3, 4, 3);
    scene.add(mainLight);

    const fillLight = new THREE.DirectionalLight(0xffffff, 0.6);
    fillLight.position.set(-3, 2, -3);
    scene.add(fillLight);

    controls = new THREE.OrbitControls(camera, renderer.domElement);
    controls.enableDamping = true;
    controls.dampingFactor = 0.05;
    controls.target.set(0, 0, 0);

    const dracoLoader = new THREE.DRACOLoader();
    dracoLoader.setDecoderPath('https://www.gstatic.com/draco/v1/decoders/');

    const gltfLoader = new THREE.GLTFLoader();
    gltfLoader.setDRACOLoader(dracoLoader);

    function createPrintMaterial() {
      return new THREE.MeshStandardMaterial({
        transparent: true,
        opacity: 0,
        depthWrite: false,
        polygonOffset: true,
        polygonOffsetFactor: -1,
        roughness: 0.8
      });
    }

    let loadedCount = 0;
    const totalFiles = 3;

    function checkAllLoaded() {
      loadedCount++;
      if (loadedCount === totalFiles) {
        document.getElementById('loading').style.opacity = '0';
      }
    }

    gltfLoader.load('hoodie-v1.glb', (gltf) => {
      mainHoodieMesh = gltf.scene;
      
      // Выставляем матовость ткани, чтобы убрать «пластиковый» глянец
      mainHoodieMesh.traverse((child) => {
        if (child.isMesh) {
          child.material.roughness = 0.85;
          child.material.metalness = 0.05;
          // Устанавливаем стартовый молочный цвет вместо жесткого белого
          child.material.color.setHex(0xF3F3F0);
        }
      });

      scene.add(mainHoodieMesh);
      checkAllLoaded();
    });

    gltfLoader.load('front_print.glb', (gltf) => {
      const mesh = gltf.scene;
      mesh.traverse((child) => {
        if (child.isMesh) {
          child.material = createPrintMaterial();
          printMeshes['front'] = child;
        }
      });
      scene.add(mesh);
      checkAllLoaded();
    });

    gltfLoader.load('back_print.glb', (gltf) => {
      const mesh = gltf.scene;
      mesh.traverse((child) => {
        if (child.isMesh) {
          child.material = createPrintMaterial();
          printMeshes['back'] = child;
        }
      });
      scene.add(mesh);
      checkAllLoaded();
    });

    window.addEventListener('resize', onWindowResize);
    animate();
  }

  function changeHoodieColor(colorHex) {
    if (!mainHoodieMesh) return;
    mainHoodieMesh.traverse((child) => {
      if (child.isMesh) {
        child.material.color.setHex(colorHex);
      }
    });
  }

  function takeScreenshot() {
    renderer.render(scene, camera);
    const dataURL = renderer.domElement.toDataURL('image/png');
    
    const link = document.createElement('a');
    link.download = 'my-custom-hoodie.png';
    link.href = dataURL;
    link.click();
  }

  function applyPrint(type, imageSrc) {
    const mesh = printMeshes[type];
    if (!mesh) return;

    textureLoader.load(imageSrc, (texture) => {
      texture.encoding = THREE.sRGBEncoding;
      texture.flipY = false;

      mesh.material.map = texture;
      mesh.material.opacity = 1.0;
      mesh.material.needsUpdate = true;
    });
  }

  function clearPrint(type) {
    const mesh = printMeshes[type];
    if (!mesh) return;

    mesh.material.opacity = 0.0;
    mesh.material.map = null;
    mesh.material.needsUpdate = true;
  }

  document.getElementById('upload-front').addEventListener('change', (e) => {
    const file = e.target.files[0];
    if (file) applyPrint('front', URL.createObjectURL(file));
  });

  document.getElementById('upload-back').addEventListener('change', (e) => {
    const file = e.target.files[0];
    if (file) applyPrint('back', URL.createObjectURL(file));
  });

  function onWindowResize() {
    camera.aspect = window.innerWidth / window.innerHeight;
    camera.updateProjectionMatrix();
    renderer.setSize(window.innerWidth, window.innerHeight);
  }

  function animate() {
    requestAnimationFrame(animate);
    controls.update();
    renderer.render(scene, camera);
  }

  init();
</script>
</body>
</html>
