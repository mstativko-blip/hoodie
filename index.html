<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Hoodie 3D Configurator</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }
    body {
      overflow: hidden;
      background-color: #f4f4f6;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      color: #18181b;
    }
    #canvas-container {
      width: 100vw;
      height: 100vh;
    }

    /* Color Selection Panel */
    .color-panel {
      position: absolute;
      top: 24px;
      left: 24px;
      background: rgba(255, 255, 255, 0.85);
      backdrop-filter: blur(12px);
      padding: 14px 18px;
      border-radius: 16px;
      border: 1px solid rgba(0, 0, 0, 0.08);
      box-shadow: 0 10px 25px rgba(0, 0, 0, 0.05);
      z-index: 20;
      display: flex;
      flex-direction: column;
      gap: 10px;
    }
    .color-panel-title {
      font-size: 11px;
      text-transform: uppercase;
      letter-spacing: 0.08em;
      color: rgba(0, 0, 0, 0.5);
      font-weight: 700;
    }
    .color-picker {
      display: flex;
      gap: 10px;
    }
    .color-btn {
      width: 28px;
      height: 28px;
      border-radius: 50%;
      border: 2px solid rgba(0, 0, 0, 0.1);
      cursor: pointer;
      transition: transform 0.2s ease, border-color 0.2s ease;
    }
    .color-btn:hover {
      transform: scale(1.15);
      border-color: #000000;
    }

    /* Bottom Control Bar */
    .bottom-controls {
      position: absolute;
      bottom: 24px;
      left: 50%;
      transform: translateX(-50%);
      display: flex;
      gap: 12px;
      background: rgba(255, 255, 255, 0.85);
      backdrop-filter: blur(12px);
      padding: 12px 20px;
      border-radius: 16px;
      border: 1px solid rgba(0, 0, 0, 0.08);
      box-shadow: 0 15px 30px rgba(0, 0, 0, 0.08);
      z-index: 20;
    }
    .btn {
      background: #18181b;
      color: #ffffff;
      padding: 10px 18px;
      border-radius: 8px;
      cursor: pointer;
      font-weight: 600;
      font-size: 13px;
      border: none;
      transition: all 0.2s ease;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      min-width: 130px;
    }
    .btn:hover {
      background: #27272a;
      transform: translateY(-1px);
    }
    .btn-reset {
      background: rgba(239, 68, 68, 0.12);
      color: #dc2626;
      border: 1px solid rgba(239, 68, 68, 0.25);
    }
    .btn-reset:hover {
      background: rgba(239, 68, 68, 0.2);
      color: #991b1b;
    }
    .btn-action {
      background: #2563eb;
      color: #ffffff;
      min-width: auto;
    }
    .btn-action:hover {
      background: #1d4ed8;
    }
    input[type="file"] {
      display: none;
    }
    #loading {
      position: absolute;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      font-size: 15px;
      letter-spacing: 0.05em;
      color: rgba(0, 0, 0, 0.5);
      pointer-events: none;
      transition: opacity 0.4s ease;
      font-weight: 500;
    }
  </style>

  <!-- Three.js + Loaders -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/OrbitControls.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/loaders/GLTFLoader.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/loaders/DRACOLoader.js"></script>
</head>
<body>

<div id="loading">Loading 3D Model...</div>
<div id="canvas-container"></div>

<!-- Palette Panel -->
<div class="color-panel">
  <div class="color-panel-title">Hoodie Color</div>
  <div class="color-picker">
    <div class="color-btn" style="background: #F3F3F0;" title="Off-White" onclick="changeHoodieColor(0xF3F3F0)"></div>
    <div class="color-btn" style="background: #1A1A1D;" title="Charcoal" onclick="changeHoodieColor(0x1A1A1D)"></div>
    <div class="color-btn" style="background: #5A5D64;" title="Heather Gray" onclick="changeHoodieColor(0x5A5D64)"></div>
    <div class="color-btn" style="background: #8B2626;" title="Muted Red" onclick="changeHoodieColor(0x8B2626)"></div>
    <div class="color-btn" style="background: #2D4A3E;" title="Sage Green" onclick="changeHoodieColor(0x2D4A3E)"></div>
    <div class="color-btn" style="background: #4A254B;" title="Deep Plum" onclick="changeHoodieColor(0x4A254B)"></div>
  </div>
</div>

<!-- Controls Panel -->
<div class="bottom-controls">
  <!-- Front Button -->
  <div id="wrapper-front">
    <label for="upload-front" class="btn" id="btn-front-label">Front Print</label>
    <input type="file" id="upload-front" accept="image/*">
    <button class="btn btn-reset" id="btn-front-reset" style="display: none;" onclick="clearPrint('front')">Reset Front</button>
  </div>

  <!-- Back Button -->
  <div id="wrapper-back">
    <label for="upload-back" class="btn" id="btn-back-label">Back Print</label>
    <input type="file" id="upload-back" accept="image/*">
    <button class="btn btn-reset" id="btn-back-reset" style="display: none;" onclick="clearPrint('back')">Reset Back</button>
  </div>

  <button class="btn btn-action" onclick="takeScreenshot()">Take Screenshot</button>
</div>

<script>
  let scene, camera, renderer, controls;
  const printMeshes = {};
  let mainHoodieMesh = null;
  let fabricNormalMap = null;
  let fabricAOMap = null;
  const textureLoader = new THREE.TextureLoader();

  function init() {
    const container = document.getElementById('canvas-container');

    scene = new THREE.Scene();
    scene.background = new THREE.Color(0xf4f4f6);

    camera = new THREE.PerspectiveCamera(45, window.innerWidth / window.innerHeight, 0.1, 100);
    camera.position.set(0, 0, 1.8);

    // Alpha: true позволяет рендерить прозрачный фон при сниппете
    renderer = new THREE.WebGLRenderer({ antialias: true, preserveDrawingBuffer: true, alpha: true });
    renderer.setSize(window.innerWidth, window.innerHeight);
    renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
    renderer.toneMapping = THREE.ACESFilmicToneMapping;
    renderer.toneMappingExposure = 1.05;
    container.appendChild(renderer.domElement);

    // Soft Studio Lighting
    const ambientLight = new THREE.AmbientLight(0xffffff, 0.95);
    scene.add(ambientLight);

    const mainLight = new THREE.DirectionalLight(0xffffff, 1.2);
    mainLight.position.set(3, 4, 3);
    scene.add(mainLight);

    const fillLight = new THREE.DirectionalLight(0xffffff, 0.5);
    fillLight.position.set(-3, 2, -3);
    scene.add(fillLight);

    controls = new THREE.OrbitControls(camera, renderer.domElement);
    controls.enableDamping = true;
    controls.dampingFactor = 0.05;
    controls.target.set(0, 0, 0);

    const dracoLoader = new THREE.DRACOLoader();
    dracoLoader.setDecoderPath('https://www.gstatic.com/draco/v1/decoders/');

    const gltfLoader = new THREE.GLTFLoader();
    gltfLoader.setDRACOLoader(dracoLoader);

    let loadedCount = 0;
    const totalFiles = 3;

    function checkAllLoaded() {
      loadedCount++;
      if (loadedCount === totalFiles) {
        document.getElementById('loading').style.opacity = '0';
      }
    }

    // Load Main Hoodie Mesh
    gltfLoader.load('hoodie-v1.glb', (gltf) => {
      mainHoodieMesh = gltf.scene;
      mainHoodieMesh.traverse((child) => {
        if (child.isMesh) {
          child.material.roughness = 0.85;
          child.material.metalness = 0.05;
          child.material.color.setHex(0xF3F3F0);

          if (child.material.normalMap) fabricNormalMap = child.material.normalMap;
          if (child.material.aoMap) fabricAOMap = child.material.aoMap;
        }
      });
      scene.add(mainHoodieMesh);
      checkAllLoaded();
    });

    function createPrintMaterial() {
      const mat = new THREE.MeshStandardMaterial({
        transparent: true,
        opacity: 0,
        depthWrite: false,
        polygonOffset: true,
        polygonOffsetFactor: -1,
        roughness: 0.68,
        metalness: 0.02
      });

      if (fabricNormalMap) mat.normalMap = fabricNormalMap;
      if (fabricAOMap) {
        mat.aoMap = fabricAOMap;
        mat.aoMapIntensity = 1.0;
      }

      return mat;
    }

    // Front Mesh
    gltfLoader.load('front_print.glb', (gltf) => {
      const mesh = gltf.scene;
      mesh.traverse((child) => {
        if (child.isMesh) {
          child.material = createPrintMaterial();
          printMeshes['front'] = child;
        }
      });
      scene.add(mesh);
      checkAllLoaded();
    });

    // Back Mesh
    gltfLoader.load('back_print.glb', (gltf) => {
      const mesh = gltf.scene;
      mesh.traverse((child) => {
        if (child.isMesh) {
          child.material = createPrintMaterial();
          printMeshes['back'] = child;
        }
      });
      scene.add(mesh);
      checkAllLoaded();
    });

    window.addEventListener('resize', onWindowResize);
    animate();
  }

  function changeHoodieColor(colorHex) {
    if (!mainHoodieMesh) return;
    mainHoodieMesh.traverse((child) => {
      if (child.isMesh) {
        child.material.color.setHex(colorHex);
      }
    });
  }

  // Copy Screenshot on TRANSPARENT background directly to Clipboard
  async function takeScreenshot() {
    const btn = document.querySelector('.btn-action');

    // 1. Временно отключаем фон сцены для прозрачности
    const originalBg = scene.background;
    scene.background = null;

    // 2. Рендерим кадр
    renderer.render(scene, camera);

    // 3. Копируем в буфер обмена
    renderer.domElement.toBlob(async (blob) => {
      // Возвращаем серый фон на сцену сразу после рендера
      scene.background = originalBg;
      renderer.render(scene, camera);

      try {
        const item = new ClipboardItem({ 'image/png': blob });
        await navigator.clipboard.write([item]);
        
        if (btn) {
          const originalText = btn.innerText;
          btn.innerText = 'Copied!';
          setTimeout(() => {
            btn.innerText = originalText;
          }, 1500);
        }
      } catch (err) {
        console.error('Failed to copy screenshot: ', err);
      }
    }, 'image/png');
  }

  // Load Print with COVER mode & mirror fix
  function applyPrint(type, imageSrc) {
    const mesh = printMeshes[type];
    if (!mesh) return;

    textureLoader.load(imageSrc, (texture) => {
      texture.encoding = THREE.sRGBEncoding;
      texture.flipY = false;

      texture.wrapS = THREE.ClampToEdgeWrapping;
      texture.wrapT = THREE.ClampToEdgeWrapping;

      const img = texture.image;
      const imgAspect = img.width / img.height;

      const meshAspect = 1.31;

      let repeatX = 1;
      let repeatY = 1;

      if (imgAspect > meshAspect) {
        repeatX = meshAspect / imgAspect;
      } else {
        repeatY = imgAspect / meshAspect;
      }

      if (type === 'back') {
        texture.repeat.set(-repeatX, repeatY);
        texture.offset.set((1 + repeatX) / 2, (1 - repeatY) / 2);
      } else {
        texture.repeat.set(repeatX, repeatY);
        texture.offset.set((1 - repeatX) / 2, (1 - repeatY) / 2);
      }

      mesh.material.map = texture;
      mesh.material.opacity = 1.0;
      mesh.material.needsUpdate = true;

      document.getElementById(`btn-${type}-label`).style.display = 'none';
      document.getElementById(`btn-${type}-reset`).style.display = 'inline-flex';
    });
  }

  function clearPrint(type) {
    const mesh = printMeshes[type];
    if (!mesh) return;

    mesh.material.opacity = 0.0;
    mesh.material.map = null;
    mesh.material.needsUpdate = true;

    document.getElementById(`upload-${type}`).value = '';

    document.getElementById(`btn-${type}-reset`).style.display = 'none';
    document.getElementById(`btn-${type}-label`).style.display = 'inline-flex';
  }

  document.getElementById('upload-front').addEventListener('change', (e) => {
    const file = e.target.files[0];
    if (file) applyPrint('front', URL.createObjectURL(file));
  });

  document.getElementById('upload-back').addEventListener('change', (e) => {
    const file = e.target.files[0];
    if (file) applyPrint('back', URL.createObjectURL(file));
  });

  function onWindowResize() {
    camera.aspect = window.innerWidth / window.innerHeight;
    camera.updateProjectionMatrix();
    renderer.setSize(window.innerWidth, window.innerHeight);
  }

  function animate() {
    requestAnimationFrame(animate);
    controls.update();
    renderer.render(scene, camera);
  }

  init();
</script>
</body>
</html>
