<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Hoodie 3D Configurator</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }
    body {
      overflow: hidden;
      background-color: #f4f4f6;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      color: #18181b;
    }
    #canvas-container {
      width: 100vw;
      height: 100vh;
    }

    /* Palette Panel */
    .color-panel {
      position: absolute;
      top: 24px;
      left: 24px;
      background: rgba(255, 255, 255, 0.85);
      backdrop-filter: blur(12px);
      padding: 14px 18px;
      border-radius: 16px;
      border: 1px solid rgba(0, 0, 0, 0.08);
      box-shadow: 0 10px 25px rgba(0, 0, 0, 0.05);
      z-index: 20;
      display: flex;
      flex-direction: column;
      gap: 10px;
    }
    .color-panel-title {
      font-size: 11px;
      text-transform: uppercase;
      letter-spacing: 0.08em;
      color: rgba(0, 0, 0, 0.5);
      font-weight: 700;
    }
    .color-picker {
      display: flex;
      gap: 10px;
    }
    .color-btn {
      width: 28px;
      height: 28px;
      border-radius: 50%;
      border: 2px solid rgba(0, 0, 0, 0.1);
      cursor: pointer;
      transition: transform 0.2s ease, border-color 0.2s ease;
    }
    .color-btn:hover {
      transform: scale(1.15);
      border-color: #000000;
    }

    /* Bottom Control Bar */
    .bottom-controls {
      position: absolute;
      bottom: 24px;
      left: 50%;
      transform: translateX(-50%);
      display: flex;
      gap: 12px;
      background: rgba(255, 255, 255, 0.85);
      backdrop-filter: blur(12px);
      padding: 12px 20px;
      border-radius: 16px;
      border: 1px solid rgba(0, 0, 0, 0.08);
      box-shadow: 0 15px 30px rgba(0, 0, 0, 0.08);
      z-index: 20;
    }
    .control-group {
      display: flex;
      gap: 6px;
    }
    .btn {
      background: #18181b;
      color: #ffffff;
      padding: 10px 18px;
      border-radius: 8px;
      cursor: pointer;
      font-weight: 600;
      font-size: 13px;
      border: none;
      transition: all 0.2s ease;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      min-width: 120px;
    }
    .btn:hover {
      background: #27272a;
      transform: translateY(-1px);
    }
    .btn-secondary {
      background: rgba(24, 24, 27, 0.08);
      color: #18181b;
      min-width: auto;
    }
    .btn-secondary:hover {
      background: rgba(24, 24, 27, 0.15);
    }
    .btn-reset {
      background: rgba(239, 68, 68, 0.12);
      color: #dc2626;
      border: 1px solid rgba(239, 68, 68, 0.25);
      min-width: auto;
    }
    .btn-reset:hover {
      background: rgba(239, 68, 68, 0.2);
      color: #991b1b;
    }
    .btn-action {
      background: #2563eb;
      color: #ffffff;
      min-width: auto;
    }
    .btn-action:hover {
      background: #1d4ed8;
    }
    input[type="file"] {
      display: none;
    }
    #loading {
      position: absolute;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      font-size: 15px;
      letter-spacing: 0.05em;
      color: rgba(0, 0, 0, 0.5);
      pointer-events: none;
      transition: opacity 0.4s ease;
      font-weight: 500;
    }

    /* Pop-up Modal Window */
    .modal-overlay {
      position: fixed;
      top: 0;
      left: 0;
      width: 100vw;
      height: 100vh;
      background: rgba(0, 0, 0, 0.4);
      backdrop-filter: blur(8px);
      z-index: 100;
      display: none;
      align-items: center;
      justify-content: center;
    }
    .modal-card {
      background: #ffffff;
      width: 90%;
      max-width: 620px;
      border-radius: 20px;
      padding: 24px;
      box-shadow: 0 20px 40px rgba(0, 0, 0, 0.2);
      display: flex;
      flex-direction: column;
      gap: 16px;
    }
    .modal-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
    }
    .modal-title {
      font-size: 16px;
      font-weight: 700;
      color: #18181b;
    }
    .crop-container {
      width: 100%;
      aspect-ratio: 1.31;
      border-radius: 12px;
      background: #e4e4e7;
      border: 2px dashed #2563eb;
      position: relative;
      overflow: hidden;
      display: flex;
      align-items: center;
      justify-content: center;
      user-select: none;
    }
    #editor-canvas {
      width: 100%;
      height: 100%;
      cursor: grab;
      background-image: 
        linear-gradient(45deg, #ccc 25%, transparent 25%), 
        linear-gradient(-45deg, #ccc 25%, transparent 25%), 
        linear-gradient(45deg, transparent 75%, #ccc 75%), 
        linear-gradient(-45deg, transparent 75%, #ccc 75%);
      background-size: 16px 16px;
      background-position: 0 0, 0 8px, 8px -8px, -8px 0px;
    }
    #editor-canvas:active {
      cursor: grabbing;
    }

    /* Editor Toolbar */
    .editor-toolbar {
      display: flex;
      flex-wrap: wrap;
      gap: 12px;
      align-items: center;
      justify-content: space-between;
      background: #f4f4f6;
      padding: 10px 14px;
      border-radius: 12px;
    }
    .tool-group {
      display: flex;
      gap: 6px;
      align-items: center;
    }
    .tool-btn {
      background: #ffffff;
      border: 1px solid rgba(0, 0, 0, 0.1);
      padding: 6px 12px;
      border-radius: 6px;
      font-size: 12px;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.15s ease;
      color: #18181b;
    }
    .tool-btn:hover {
      background: #18181b;
      color: #ffffff;
    }
    .slider-control {
      display: flex;
      align-items: center;
      gap: 8px;
      font-size: 12px;
      font-weight: 600;
      color: #52525b;
    }
    .slider-control input[type="range"] {
      width: 90px;
      cursor: pointer;
    }

    .modal-actions {
      display: flex;
      justify-content: flex-end;
      gap: 10px;
    }
  </style>

  <!-- Three.js + Loaders -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/OrbitControls.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/loaders/GLTFLoader.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/loaders/DRACOLoader.js"></script>
</head>
<body>

<div id="loading">Loading 3D Model...</div>
<div id="canvas-container"></div>

<!-- Palette Panel -->
<div class="color-panel">
  <div class="color-panel-title">Hoodie Color</div>
  <div class="color-picker">
    <div class="color-btn" style="background: #F3F3F0;" title="Off-White" onclick="changeHoodieColor(0xF3F3F0)"></div>
    <div class="color-btn" style="background: #1A1A1D;" title="Charcoal" onclick="changeHoodieColor(0x1A1A1D)"></div>
    <div class="color-btn" style="background: #5A5D64;" title="Heather Gray" onclick="changeHoodieColor(0x5A5D64)"></div>
    <div class="color-btn" style="background: #8B2626;" title="Muted Red" onclick="changeHoodieColor(0x8B2626)"></div>
    <div class="color-btn" style="background: #2D4A3E;" title="Sage Green" onclick="changeHoodieColor(0x2D4A3E)"></div>
    <div class="color-btn" style="background: #4A254B;" title="Deep Plum" onclick="changeHoodieColor(0x4A254B)"></div>
  </div>
</div>

<!-- Controls Panel -->
<div class="bottom-controls">
  <div id="wrapper-front">
    <label for="upload-front" class="btn" id="btn-front-upload">Front Print</label>
    <input type="file" id="upload-front" accept="image/*">
    <div id="group-front-active" class="control-group" style="display: none;">
      <button class="btn btn-secondary" onclick="reeditPrint('front')">Edit Front</button>
      <button class="btn btn-reset" onclick="clearPrint('front')">Remove</button>
    </div>
  </div>

  <div id="wrapper-back">
    <label for="upload-back" class="btn" id="btn-back-upload">Back Print</label>
    <input type="file" id="upload-back" accept="image/*">
    <div id="group-back-active" class="control-group" style="display: none;">
      <button class="btn btn-secondary" onclick="reeditPrint('back')">Edit Back</button>
      <button class="btn btn-reset" onclick="clearPrint('back')">Remove</button>
    </div>
  </div>

  <button class="btn btn-action" onclick="takeScreenshot()">Take Screenshot</button>
</div>

<!-- Editor Pop-up Modal -->
<div class="modal-overlay" id="crop-modal">
  <div class="modal-card">
    <div class="modal-header">
      <div class="modal-title" id="crop-modal-title">Adjust Print Position</div>
    </div>
    
    <div class="crop-container">
      <canvas id="editor-canvas" width="1024" height="781"></canvas>
    </div>

    <!-- Controls Toolbar -->
    <div class="editor-toolbar">
      <div class="tool-group">
        <button class="tool-btn" onclick="resetTransform()">Original</button>
        <button class="tool-btn" onclick="toggleFlipX()">Flip H</button>
        <button class="tool-btn" onclick="alignZero()">Align (0°)</button>
      </div>
      <div class="slider-control">
        <span>Scale:</span>
        <input type="range" id="scale-range" min="0.1" max="3" step="0.01" value="1" oninput="handleScaleSlider(this.value)">
      </div>
      <div class="slider-control">
        <span>Rotate:</span>
        <input type="range" id="rotate-range" min="-180" max="180" value="0" oninput="handleRotateSlider(this.value)">
      </div>
    </div>

    <div class="modal-actions">
      <button class="btn btn-secondary" onclick="closeCropModal()">Cancel</button>
      <button class="btn btn-action" onclick="applyCroppedPrint()">Apply</button>
    </div>
  </div>
</div>

<script>
  let scene, camera, renderer, controls;
  const printMeshes = {};
  let mainHoodieMesh = null;
  let fabricNormalMap = null;
  let fabricAOMap = null;
  const textureLoader = new THREE.TextureLoader();

  // Print Transform State & Store
  let currentEditingType = null;
  const loadedImageObjects = { front: null, back: null };
  const printTransformState = {
    front: { x: 512, y: 390.5, scale: 1, rotate: 0, flipX: 1 },
    back: { x: 512, y: 390.5, scale: 1, rotate: 0, flipX: 1 }
  };

  // Canvas Editor Context
  let editorCanvas, editorCtx;
  let isDragging = false;
  let dragStart = { x: 0, y: 0 };

  function init() {
    const container = document.getElementById('canvas-container');

    scene = new THREE.Scene();
    scene.background = new THREE.Color(0xf4f4f6);

    camera = new THREE.PerspectiveCamera(45, window.innerWidth / window.innerHeight, 0.1, 100);
    camera.position.set(0, 0, 1.8);

    renderer = new THREE.WebGLRenderer({ antialias: true, preserveDrawingBuffer: true, alpha: true });
    renderer.setSize(window.innerWidth, window.innerHeight);
    renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
    renderer.toneMapping = THREE.ACESFilmicToneMapping;
    renderer.toneMappingExposure = 1.05;
    container.appendChild(renderer.domElement);

    const ambientLight = new THREE.AmbientLight(0xffffff, 0.95);
    scene.add(ambientLight);

    const mainLight = new THREE.DirectionalLight(0xffffff, 1.2);
    mainLight.position.set(3, 4, 3);
    scene.add(mainLight);

    const fillLight = new THREE.DirectionalLight(0xffffff, 0.5);
    fillLight.position.set(-3, 2, -3);
    scene.add(fillLight);

    controls = new THREE.OrbitControls(camera, renderer.domElement);
    controls.enableDamping = true;
    controls.dampingFactor = 0.05;
    controls.target.set(0, 0, 0);

    const dracoLoader = new THREE.DRACOLoader();
    dracoLoader.setDecoderPath('https://www.gstatic.com/draco/v1/decoders/');

    const gltfLoader = new THREE.GLTFLoader();
    gltfLoader.setDRACOLoader(dracoLoader);

    let loadedCount = 0;
    const totalFiles = 3;

    function checkAllLoaded() {
      loadedCount++;
      if (loadedCount === totalFiles) {
        document.getElementById('loading').style.opacity = '0';
      }
    }

    gltfLoader.load('hoodie-v1.glb', (gltf) => {
      mainHoodieMesh = gltf.scene;
      mainHoodieMesh.traverse((child) => {
        if (child.isMesh) {
          child.material.roughness = 0.85;
          child.material.metalness = 0.05;
          child.material.color.setHex(0xF3F3F0);

          if (child.material.normalMap) fabricNormalMap = child.material.normalMap;
          if (child.material.aoMap) fabricAOMap = child.material.aoMap;
        }
      });
      scene.add(mainHoodieMesh);
      checkAllLoaded();
    });

    function createPrintMaterial() {
      const mat = new THREE.MeshStandardMaterial({
        transparent: true,
        opacity: 0,
        depthWrite: false,
        polygonOffset: true,
        polygonOffsetFactor: -1,
        roughness: 0.68,
        metalness: 0.02
      });

      if (fabricNormalMap) mat.normalMap = fabricNormalMap;
      if (fabricAOMap) {
        mat.aoMap = fabricAOMap;
        mat.aoMapIntensity = 1.0;
      }

      return mat;
    }

    gltfLoader.load('front_print.glb', (gltf) => {
      const mesh = gltf.scene;
      mesh.traverse((child) => {
        if (child.isMesh) {
          child.material = createPrintMaterial();
          printMeshes['front'] = child;
        }
      });
      scene.add(mesh);
      checkAllLoaded();
    });

    gltfLoader.load('back_print.glb', (gltf) => {
      const mesh = gltf.scene;
      mesh.traverse((child) => {
        if (child.isMesh) {
          child.material = createPrintMaterial();
          printMeshes['back'] = child;
        }
      });
      scene.add(mesh);
      checkAllLoaded();
    });

    setupEditorEvents();
    window.addEventListener('resize', onWindowResize);
    animate();
  }

  function setupEditorEvents() {
    editorCanvas = document.getElementById('editor-canvas');
    editorCtx = editorCanvas.getContext('2d');

    editorCanvas.addEventListener('mousedown', (e) => {
      isDragging = true;
      dragStart = { x: e.clientX, y: e.clientY };
    });

    window.addEventListener('mousemove', (e) => {
      if (!isDragging || !currentEditingType) return;
      const rect = editorCanvas.getBoundingClientRect();
      const scaleX = editorCanvas.width / rect.width;
      const scaleY = editorCanvas.height / rect.height;

      const dx = (e.clientX - dragStart.x) * scaleX;
      const dy = (e.clientY - dragStart.y) * scaleY;

      const state = printTransformState[currentEditingType];
      state.x += dx;
      state.y += dy;

      dragStart = { x: e.clientX, y: e.clientY };
      drawEditorCanvas();
    });

    window.addEventListener('mouseup', () => { isDragging = false; });

    editorCanvas.addEventListener('wheel', (e) => {
      if (!currentEditingType) return;
      e.preventDefault();
      const state = printTransformState[currentEditingType];
      const zoomFactor = e.deltaY < 0 ? 1.05 : 0.95;
      state.scale = Math.min(Math.max(0.05, state.scale * zoomFactor), 4);
      document.getElementById('scale-range').value = state.scale;
      drawEditorCanvas();
    }, { passive: false });
  }

  function changeHoodieColor(colorHex) {
    if (!mainHoodieMesh) return;
    mainHoodieMesh.traverse((child) => {
      if (child.isMesh) child.material.color.setHex(colorHex);
    });
  }

  function openCropModal(type, imgObj) {
    currentEditingType = type;
    loadedImageObjects[type] = imgObj;

    document.getElementById('crop-modal-title').innerText = `Adjust ${type === 'front' ? 'Front' : 'Back'} Print`;
    document.getElementById('crop-modal').style.display = 'flex';

    const state = printTransformState[type];
    document.getElementById('scale-range').value = state.scale;
    document.getElementById('rotate-range').value = state.rotate;

    drawEditorCanvas();
  }

  function drawEditorCanvas() {
    if (!currentEditingType || !loadedImageObjects[currentEditingType]) return;

    const img = loadedImageObjects[currentEditingType];
    const state = printTransformState[currentEditingType];

    editorCtx.clearRect(0, 0, editorCanvas.width, editorCanvas.height);

    editorCtx.save();
    editorCtx.translate(state.x, state.y);
    editorCtx.rotate((state.rotate * Math.PI) / 180);
    editorCtx.scale(state.scale * state.flipX, state.scale);

    // Центрируем отрисовку картинки в перенесенной точке
    editorCtx.drawImage(img, -img.width / 2, -img.height / 2);
    editorCtx.restore();
  }

  function resetTransform() {
    if (!currentEditingType || !loadedImageObjects[currentEditingType]) return;
    const img = loadedImageObjects[currentEditingType];
    const state = printTransformState[currentEditingType];

    state.x = editorCanvas.width / 2;
    state.y = editorCanvas.height / 2;
    state.rotate = 0;
    state.flipX = 1;
    // Подгоняем масштаб, чтобы картинка красиво встала в рамку по умолчанию
    state.scale = Math.min((editorCanvas.width * 0.7) / img.width, (editorCanvas.height * 0.7) / img.height);

    document.getElementById('scale-range').value = state.scale;
    document.getElementById('rotate-range').value = 0;
    drawEditorCanvas();
  }

  function toggleFlipX() {
    if (!currentEditingType) return;
    printTransformState[currentEditingType].flipX *= -1;
    drawEditorCanvas();
  }

  function alignZero() {
    if (!currentEditingType) return;
    printTransformState[currentEditingType].rotate = 0;
    document.getElementById('rotate-range').value = 0;
    drawEditorCanvas();
  }

  function handleScaleSlider(val) {
    if (!currentEditingType) return;
    printTransformState[currentEditingType].scale = parseFloat(val);
    drawEditorCanvas();
  }

  function handleRotateSlider(val) {
    if (!currentEditingType) return;
    printTransformState[currentEditingType].rotate = parseFloat(val);
    drawEditorCanvas();
  }

  function closeCropModal() {
    document.getElementById('crop-modal').style.display = 'none';
  }

  function applyCroppedPrint() {
    if (!currentEditingType) return;

    const printDataUrl = editorCanvas.toDataURL('image/png');
    applyPrintToMesh(currentEditingType, printDataUrl);

    document.getElementById(`btn-${currentEditingType}-upload`).style.display = 'none';
    document.getElementById(`group-${currentEditingType}-active`).style.display = 'inline-flex';

    closeCropModal();
  }

  function reeditPrint(type) {
    if (loadedImageObjects[type]) {
      openCropModal(type, loadedImageObjects[type]);
    }
  }

  function applyPrintToMesh(type, imageSrc) {
    const mesh = printMeshes[type];
    if (!mesh) return;

    textureLoader.load(imageSrc, (texture) => {
      texture.encoding = THREE.sRGBEncoding;
      texture.flipY = false;
      texture.wrapS = THREE.ClampToEdgeWrapping;
      texture.wrapT = THREE.ClampToEdgeWrapping;

      if (type === 'back') {
        texture.repeat.set(-1, 1);
        texture.offset.set(1, 0);
      } else {
        texture.repeat.set(1, 1);
        texture.offset.set(0, 0);
      }

      mesh.material.map = texture;
      mesh.material.opacity = 1.0;
      mesh.material.needsUpdate = true;
    });
  }

  function clearPrint(type) {
    const mesh = printMeshes[type];
    if (!mesh) return;

    mesh.material.opacity = 0.0;
    mesh.material.map = null;
    mesh.material.needsUpdate = true;

    loadedImageObjects[type] = null;
    printTransformState[type] = { x: 512, y: 390.5, scale: 1, rotate: 0, flipX: 1 };
    document.getElementById(`upload-${type}`).value = '';

    document.getElementById(`group-${type}-active`).style.display = 'none';
    document.getElementById(`btn-${type}-upload`).style.display = 'inline-flex';
  }

  function handleFileSelect(type, e) {
    const file = e.target.files[0];
    if (file) {
      const img = new Image();
      img.onload = () => {
        loadedImageObjects[type] = img;
        resetTransform(); // Автомасштаб при первом вбросе
        openCropModal(type, img);
      };
      img.src = URL.createObjectURL(file);
    }
  }

  document.getElementById('upload-front').addEventListener('change', (e) => handleFileSelect('front', e));
  document.getElementById('upload-back').addEventListener('change', (e) => handleFileSelect('back', e));

  async function takeScreenshot() {
    const btn = document.querySelector('.btn-action');
    const originalBg = scene.background;
    scene.background = null;

    renderer.render(scene, camera);

    renderer.domElement.toBlob(async (blob) => {
      scene.background = originalBg;
      renderer.render(scene, camera);

      try {
        const item = new ClipboardItem({ 'image/png': blob });
        await navigator.clipboard.write([item]);
        
        if (btn) {
          const originalText = btn.innerText;
          btn.innerText = 'Copied!';
          setTimeout(() => { btn.innerText = originalText; }, 1500);
        }
      } catch (err) {
        console.error('Failed to copy screenshot: ', err);
      }
    }, 'image/png');
  }

  function onWindowResize() {
    camera.aspect = window.innerWidth / window.innerHeight;
    camera.updateProjectionMatrix();
    renderer.setSize(window.innerWidth, window.innerHeight);
  }

  function animate() {
    requestAnimationFrame(animate);
    controls.update();
    renderer.render(scene, camera);
  }

  init();
</script>
</body>
</html>
