<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Hoodie 3D Configurator</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }
    body {
      overflow: hidden;
      background-color: #121212;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      color: #ffffff;
    }
    #canvas-container {
      width: 100vw;
      height: 100vh;
    }

    /* Панель выбора цвета (Левый верхний угол) */
    .color-panel {
      position: absolute;
      top: 24px;
      left: 24px;
      background: rgba(24, 24, 27, 0.85);
      backdrop-filter: blur(12px);
      padding: 14px 18px;
      border-radius: 16px;
      border: 1px solid rgba(255, 255, 255, 0.12);
      box-shadow: 0 10px 25px rgba(0, 0, 0, 0.4);
      z-index: 20;
      display: flex;
      flex-direction: column;
      gap: 10px;
    }
    .color-panel-title {
      font-size: 12px;
      text-transform: uppercase;
      letter-spacing: 0.08em;
      color: rgba(255, 255, 255, 0.6);
      font-weight: 600;
    }
    .color-picker {
      display: flex;
      gap: 10px;
    }
    .color-btn {
      width: 28px;
      height: 28px;
      border-radius: 50%;
      border: 2px solid rgba(255, 255, 255, 0.2);
      cursor: pointer;
      transition: transform 0.2s ease, border-color 0.2s ease;
    }
    .color-btn:hover {
      transform: scale(1.15);
      border-color: #ffffff;
    }

    /* Нижняя панель элементов */
    .bottom-controls {
      position: absolute;
      bottom: 24px;
      left: 50%;
      transform: translateX(-50%);
      display: flex;
      gap: 12px;
      background: rgba(24, 24, 27, 0.85);
      backdrop-filter: blur(12px);
      padding: 12px 20px;
      border-radius: 16px;
      border: 1px solid rgba(255, 255, 255, 0.12);
      box-shadow: 0 20px 25px -5px rgba(0, 0, 0, 0.5);
      z-index: 20;
    }
    .btn {
      background: #ffffff;
      color: #000000;
      padding: 10px 18px;
      border-radius: 8px;
      cursor: pointer;
      font-weight: 600;
      font-size: 13px;
      border: none;
      transition: all 0.2s ease;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      min-width: 140px;
    }
    .btn:hover {
      background: #e4e4e7;
      transform: translateY(-1px);
    }
    .btn-reset {
      background: rgba(239, 68, 68, 0.2);
      color: #f87171;
      border: 1px solid rgba(239, 68, 68, 0.4);
    }
    .btn-reset:hover {
      background: rgba(239, 68, 68, 0.3);
      color: #ffffff;
    }
    .btn-action {
      background: #2563eb;
      color: #ffffff;
      min-width: auto;
    }
    .btn-action:hover {
      background: #1d4ed8;
    }
    input[type="file"] {
      display: none;
    }
    #loading {
      position: absolute;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      font-size: 16px;
      letter-spacing: 0.05em;
      color: rgba(255, 255, 255, 0.6);
      pointer-events: none;
      transition: opacity 0.4s ease;
    }
  </style>

  <!-- Three.js + Loaders -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/OrbitControls.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/loaders/GLTFLoader.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/loaders/DRACOLoader.js"></script>
</head>
<body>

<div id="loading">Загрузка 3D модели...</div>
<div id="canvas-container"></div>

<!-- Палитра выбора цвета -->
<div class="color-panel">
  <div class="color-panel-title">Цвет худи</div>
  <div class="color-picker">
    <div class="color-btn" style="background: #F3F3F0;" title="Молочный" onclick="changeHoodieColor(0xF3F3F0)"></div>
    <div class="color-btn" style="background: #1A1A1D;" title="Графит" onclick="changeHoodieColor(0x1A1A1D)"></div>
    <div class="color-btn" style="background: #5A5D64;" title="Меланж" onclick="changeHoodieColor(0x5A5D64)"></div>
    <div class="color-btn" style="background: #8B2626;" title="Бордо" onclick="changeHoodieColor(0x8B2626)"></div>
    <div class="color-btn" style="background: #2D4A3E;" title="Оливковый" onclick="changeHoodieColor(0x2D4A3E)"></div>
    <div class="color-btn" style="background: #4A254B;" title="Сливовый" onclick="changeHoodieColor(0x4A254B)"></div>
  </div>
</div>

<!-- Нижняя панель динамических кнопок -->
<div class="bottom-controls">
  <!-- Переключаемая кнопка спереди -->
  <div id="wrapper-front">
    <label for="upload-front" class="btn" id="btn-front-label">Принт спереди</label>
    <input type="file" id="upload-front" accept="image/*">
    <button class="btn btn-reset" id="btn-front-reset" style="display: none;" onclick="clearPrint('front')">Сбросить спереди</button>
  </div>

  <!-- Переключаемая кнопка сзади -->
  <div id="wrapper-back">
    <label for="upload-back" class="btn" id="btn-back-label">Принт сзади</label>
    <input type="file" id="upload-back" accept="image/*">
    <button class="btn btn-reset" id="btn-back-reset" style="display: none;" onclick="clearPrint('back')">Сбросить сзади</button>
  </div>

  <button class="btn btn-action" onclick="takeScreenshot()">Сделать скриншот</button>
</div>

<script>
  let scene, camera, renderer, controls;
  const printMeshes = {};
  let mainHoodieMesh = null;
  const textureLoader = new THREE.TextureLoader();

  function init() {
    const container = document.getElementById('canvas-container');

    scene = new THREE.Scene();
    scene.background = new THREE.Color(0x121212);

    camera = new THREE.PerspectiveCamera(45, window.innerWidth / window.innerHeight, 0.1, 100);
    camera.position.set(0, 0, 1.8);

    renderer = new THREE.WebGLRenderer({ antialias: true, preserveDrawingBuffer: true });
    renderer.setSize(window.innerWidth, window.innerHeight);
    renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
    renderer.toneMapping = THREE.ACESFilmicToneMapping;
    renderer.toneMappingExposure = 1.0;
    container.appendChild(renderer.domElement);

    const ambientLight = new THREE.AmbientLight(0xffffff, 0.9);
    scene.add(ambientLight);

    const mainLight = new THREE.DirectionalLight(0xffffff, 1.3);
    mainLight.position.set(3, 4, 3);
    scene.add(mainLight);

    const fillLight = new THREE.DirectionalLight(0xffffff, 0.6);
    fillLight.position.set(-3, 2, -3);
    scene.add(fillLight);

    controls = new THREE.OrbitControls(camera, renderer.domElement);
    controls.enableDamping = true;
    controls.dampingFactor = 0.05;
    controls.target.set(0, 0, 0);

    const dracoLoader = new THREE.DRACOLoader();
    dracoLoader.setDecoderPath('https://www.gstatic.com/draco/v1/decoders/');

    const gltfLoader = new THREE.GLTFLoader();
    gltfLoader.setDRACOLoader(dracoLoader);

    function createPrintMaterial() {
      return new THREE.MeshStandardMaterial({
        transparent: true,
        opacity: 0,
        depthWrite: false,
        polygonOffset: true,
        polygonOffsetFactor: -1,
        roughness: 0.8
      });
    }

    let loadedCount = 0;
    const totalFiles = 3;

    function checkAllLoaded() {
      loadedCount++;
      if (loadedCount === totalFiles) {
        document.getElementById('loading').style.opacity = '0';
      }
    }

    gltfLoader.load('hoodie-v1.glb', (gltf) => {
      mainHoodieMesh = gltf.scene;
      mainHoodieMesh.traverse((child) => {
        if (child.isMesh) {
          child.material.roughness = 0.85;
          child.material.metalness = 0.05;
          child.material.color.setHex(0xF3F3F0);
        }
      });
      scene.add(mainHoodieMesh);
      checkAllLoaded();
    });

    gltfLoader.load('front_print.glb', (gltf) => {
      const mesh = gltf.scene;
      mesh.traverse((child) => {
        if (child.isMesh) {
          child.material = createPrintMaterial();
          printMeshes['front'] = child;
        }
      });
      scene.add(mesh);
      checkAllLoaded();
    });

    gltfLoader.load('back_print.glb', (gltf) => {
      const mesh = gltf.scene;
      mesh.traverse((child) => {
        if (child.isMesh) {
          child.material = createPrintMaterial();
          printMeshes['back'] = child;
        }
      });
      scene.add(mesh);
      checkAllLoaded();
    });

    window.addEventListener('resize', onWindowResize);
    animate();
  }

  function changeHoodieColor(colorHex) {
    if (!mainHoodieMesh) return;
    mainHoodieMesh.traverse((child) => {
      if (child.isMesh) {
        child.material.color.setHex(colorHex);
      }
    });
  }

  function takeScreenshot() {
    renderer.render(scene, camera);
    const dataURL = renderer.domElement.toDataURL('image/png');
    
    const link = document.createElement('a');
    link.download = 'my-custom-hoodie.png';
    link.href = dataURL;
    link.click();
  }

  // Загрузка принта с алгоритмом Fit по ширине
  function applyPrint(type, imageSrc) {
    const mesh = printMeshes[type];
    if (!mesh) return;

    textureLoader.load(imageSrc, (texture) => {
      texture.encoding = THREE.sRGBEncoding;
      texture.flipY = false;

      const img = texture.image;
      const imgAspect = img.width / img.height;

      texture.wrapS = THREE.ClampToEdgeWrapping;
      texture.wrapT = THREE.ClampToEdgeWrapping;

      // Растягиваем на всю ширину и кадрируем высоту по центру
      texture.repeat.set(1, 1 / imgAspect);
      texture.offset.set(0, (1 - 1 / imgAspect) / 2);

      mesh.material.map = texture;
      mesh.material.opacity = 1.0;
      mesh.material.needsUpdate = true;

      // Переключаем кнопку на "Сбросить"
      document.getElementById(`btn-${type}-label`).style.display = 'none';
      document.getElementById(`btn-${type}-reset`).style.display = 'inline-flex';
    });
  }

  // Сброс принта
  function clearPrint(type) {
    const mesh = printMeshes[type];
    if (!mesh) return;

    mesh.material.opacity = 0.0;
    mesh.material.map = null;
    mesh.material.needsUpdate = true;

    // Очищаем инпут файла
    document.getElementById(`upload-${type}`).value = '';

    // Переключаем кнопку обратно на "Загрузить"
    document.getElementById(`btn-${type}-reset`).style.display = 'none';
    document.getElementById(`btn-${type}-label`).style.display = 'inline-flex';
  }

  document.getElementById('upload-front').addEventListener('change', (e) => {
    const file = e.target.files[0];
    if (file) applyPrint('front', URL.createObjectURL(file));
  });

  document.getElementById('upload-back').addEventListener('change', (e) => {
    const file = e.target.files[0];
    if (file) applyPrint('back', URL.createObjectURL(file));
  });

  function onWindowResize() {
    camera.aspect = window.innerWidth / window.innerHeight;
    camera.updateProjectionMatrix();
    renderer.setSize(window.innerWidth, window.innerHeight);
  }

  function animate() {
    requestAnimationFrame(animate);
    controls.update();
    renderer.render(scene, camera);
  }

  init();
</script>
</body>
</html>
