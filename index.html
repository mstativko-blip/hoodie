<script>
  let scene, camera, renderer, controls;
  const printMeshes = {};
  let mainHoodieMesh = null;
  let fabricNormalMap = null;
  let fabricAOMap = null;
  const textureLoader = new THREE.TextureLoader();

  // Cropper State
  let cropper = null;
  let currentEditingType = null;
  let currentScaleX = 1;
  const originalRawImages = { front: null, back: null };

  function init() {
    const container = document.getElementById('canvas-container');

    scene = new THREE.Scene();
    scene.background = new THREE.Color(0xf4f4f6);

    camera = new THREE.PerspectiveCamera(45, window.innerWidth / window.innerHeight, 0.1, 100);
    camera.position.set(0, 0, 1.8);

    renderer = new THREE.WebGLRenderer({ antialias: true, preserveDrawingBuffer: true, alpha: true });
    renderer.setSize(window.innerWidth, window.innerHeight);
    renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
    renderer.toneMapping = THREE.ACESFilmicToneMapping;
    renderer.toneMappingExposure = 1.05;
    container.appendChild(renderer.domElement);

    // Studio Lighting
    const ambientLight = new THREE.AmbientLight(0xffffff, 0.95);
    scene.add(ambientLight);

    const mainLight = new THREE.DirectionalLight(0xffffff, 1.2);
    mainLight.position.set(3, 4, 3);
    scene.add(mainLight);

    const fillLight = new THREE.DirectionalLight(0xffffff, 0.5);
    fillLight.position.set(-3, 2, -3);
    scene.add(fillLight);

    controls = new THREE.OrbitControls(camera, renderer.domElement);
    controls.enableDamping = true;
    controls.dampingFactor = 0.05;
    controls.target.set(0, 0, 0);

    const dracoLoader = new THREE.DRACOLoader();
    dracoLoader.setDecoderPath('https://www.gstatic.com/draco/v1/decoders/');

    const gltfLoader = new THREE.GLTFLoader();
    gltfLoader.setDRACOLoader(dracoLoader);

    let loadedCount = 0;
    const totalFiles = 3;

    function checkAllLoaded() {
      loadedCount++;
      if (loadedCount === totalFiles) {
        document.getElementById('loading').style.opacity = '0';
      }
    }

    // Load Main Hoodie
    gltfLoader.load('hoodie-v1.glb', (gltf) => {
      mainHoodieMesh = gltf.scene;
      mainHoodieMesh.traverse((child) => {
        if (child.isMesh) {
          child.material.roughness = 0.85;
          child.material.metalness = 0.05;
          child.material.color.setHex(0xF3F3F0);

          if (child.material.normalMap) fabricNormalMap = child.material.normalMap;
          if (child.material.aoMap) fabricAOMap = child.material.aoMap;
        }
      });
      scene.add(mainHoodieMesh);
      checkAllLoaded();
    });

    function createPrintMaterial() {
      const mat = new THREE.MeshStandardMaterial({
        transparent: true,
        opacity: 0,
        depthWrite: false,
        polygonOffset: true,
        polygonOffsetFactor: -1,
        roughness: 0.68,
        metalness: 0.02
      });

      if (fabricNormalMap) mat.normalMap = fabricNormalMap;
      if (fabricAOMap) {
        mat.aoMap = fabricAOMap;
        mat.aoMapIntensity = 1.0;
      }

      return mat;
    }

    // Load Front Mesh
    gltfLoader.load('front_print.glb', (gltf) => {
      const mesh = gltf.scene;
      mesh.traverse((child) => {
        if (child.isMesh) {
          child.material = createPrintMaterial();
          printMeshes['front'] = child;
        }
      });
      scene.add(mesh);
      checkAllLoaded();
    });

    // Load Back Mesh
    gltfLoader.load('back_print.glb', (gltf) => {
      const mesh = gltf.scene;
      mesh.traverse((child) => {
        if (child.isMesh) {
          child.material = createPrintMaterial();
          printMeshes['back'] = child;
        }
      });
      scene.add(mesh);
      checkAllLoaded();
    });

    window.addEventListener('resize', onWindowResize);
    animate();
  }

  function changeHoodieColor(colorHex) {
    if (!mainHoodieMesh) return;
    mainHoodieMesh.traverse((child) => {
      if (child.isMesh) {
        child.material.color.setHex(colorHex);
      }
    });
  }

  // Open Crop Modal
  function openCropModal(type, imageSrc) {
    currentEditingType = type;
    document.getElementById('crop-modal-title').innerText = `Adjust ${type === 'front' ? 'Front' : 'Back'} Print`;
    
    const targetImg = document.getElementById('crop-target-image');
    targetImg.src = imageSrc;

    document.getElementById('crop-modal').style.display = 'flex';

    if (cropper) {
      cropper.destroy();
      cropper = null;
    }

    // Небольшая задержка, чтобы модалка успела отрисовать честные размеры
    setTimeout(() => {
      cropper = new Cropper(targetImg, {
        aspectRatio: 1.31,
        viewMode: 1,              // Картинка строго в пределах холста
        dragMode: 'move',         // Перетаскиваем принт
        cropBoxMovable: false,    // Рамка всегда по центру
        cropBoxResizable: false,  // Размер рамки фиксирован
        toggleDragModeOnDblclick: false,
        autoCropArea: 0.9,        // Рамка занимает 90% контейнера
        ready() {
          currentScaleX = 1;
          document.getElementById('rotate-range').value = 0;
        },
        crop(event) {
          document.getElementById('rotate-range').value = Math.round(event.detail.rotate);
        }
      });
    }, 50);
  }

  /* Editor Actions */
  function resetCropAll() {
    if (!cropper) return;
    currentScaleX = 1;
    document.getElementById('rotate-range').value = 0;
    cropper.reset();
  }

  function flipHorizontal() {
    if (!cropper) return;
    currentScaleX = currentScaleX === 1 ? -1 : 1;
    cropper.scaleX(currentScaleX);
  }

  function resetAngleOnly() {
    if (!cropper) return;
    document.getElementById('rotate-range').value = 0;
    cropper.rotateTo(0);
  }

  function handleRotateSlider(value) {
    if (!cropper) return;
    cropper.rotateTo(parseFloat(value));
  }

  function closeCropModal() {
    document.getElementById('crop-modal').style.display = 'none';
    if (cropper) {
      cropper.destroy();
      cropper = null;
    }
  }

  function applyCroppedPrint() {
    if (!cropper || !currentEditingType) return;

    // Забираем точный результат внутри синей рамки без обрезки
    const croppedCanvas = cropper.getCroppedCanvas({
      width: 1024,
      height: Math.round(1024 / 1.31),
      fillColor: 'transparent',
      imageSmoothingEnabled: true,
      imageSmoothingQuality: 'high'
    });

    const croppedDataUrl = croppedCanvas.toDataURL('image/png');
    applyPrintToMesh(currentEditingType, croppedDataUrl);

    document.getElementById(`btn-${currentEditingType}-upload`).style.display = 'none';
    document.getElementById(`group-${currentEditingType}-active`).style.display = 'inline-flex';

    closeCropModal();
  }

  function reeditPrint(type) {
    if (originalRawImages[type]) {
      openCropModal(type, originalRawImages[type]);
    }
  }

  function applyPrintToMesh(type, imageSrc) {
    const mesh = printMeshes[type];
    if (!mesh) return;

    textureLoader.load(imageSrc, (texture) => {
      texture.encoding = THREE.sRGBEncoding;
      texture.flipY = false;
      texture.wrapS = THREE.ClampToEdgeWrapping;
      texture.wrapT = THREE.ClampToEdgeWrapping;

      if (type === 'back') {
        texture.repeat.set(-1, 1);
        texture.offset.set(1, 0);
      } else {
        texture.repeat.set(1, 1);
        texture.offset.set(0, 0);
      }

      mesh.material.map = texture;
      mesh.material.opacity = 1.0;
      mesh.material.needsUpdate = true;
    });
  }

  function clearPrint(type) {
    const mesh = printMeshes[type];
    if (!mesh) return;

    mesh.material.opacity = 0.0;
    mesh.material.map = null;
    mesh.material.needsUpdate = true;

    originalRawImages[type] = null;
    document.getElementById(`upload-${type}`).value = '';

    document.getElementById(`group-${type}-active`).style.display = 'none';
    document.getElementById(`btn-${type}-upload`).style.display = 'inline-flex';
  }

  document.getElementById('upload-front').addEventListener('change', (e) => {
    const file = e.target.files[0];
    if (file) {
      const url = URL.createObjectURL(file);
      originalRawImages['front'] = url;
      openCropModal('front', url);
    }
  });

  document.getElementById('upload-back').addEventListener('change', (e) => {
    const file = e.target.files[0];
    if (file) {
      const url = URL.createObjectURL(file);
      originalRawImages['back'] = url;
      openCropModal('back', url);
    }
  });

  async function takeScreenshot() {
    const btn = document.querySelector('.btn-action');
    const originalBg = scene.background;
    scene.background = null;

    renderer.render(scene, camera);

    renderer.domElement.toBlob(async (blob) => {
      scene.background = originalBg;
      renderer.render(scene, camera);

      try {
        const item = new ClipboardItem({ 'image/png': blob });
        await navigator.clipboard.write([item]);
        
        if (btn) {
          const originalText = btn.innerText;
          btn.innerText = 'Copied!';
          setTimeout(() => {
            btn.innerText = originalText;
          }, 1500);
        }
      } catch (err) {
        console.error('Failed to copy screenshot: ', err);
      }
    }, 'image/png');
  }

  function onWindowResize() {
    camera.aspect = window.innerWidth / window.innerHeight;
    camera.updateProjectionMatrix();
    renderer.setSize(window.innerWidth, window.innerHeight);
  }

  function animate() {
    requestAnimationFrame(animate);
    controls.update();
    renderer.render(scene, camera);
  }

  init();
</script>
